<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рудник</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe7;--fg:#2a251f;--card:#fffdf8;--mut:#7b7266;--acc:#b5651d;--line:#ddd3c3;--bar:#e5ddcf}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--fg:#ece5d8;--card:#1f1b15;--mut:#9a9183;--acc:#e0914a;--line:#342e25;--bar:#2c261e}}
:root[data-theme="dark"]{--bg:#15120e;--fg:#ece5d8;--card:#1f1b15;--mut:#9a9183;--acc:#e0914a;--line:#342e25;--bar:#2c261e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px}
h1{font-size:34px;text-align:center;margin:40px 0 28px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:15px;margin:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:14px}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.small{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.hide{display:none!important}
#codeIn{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-transform:uppercase;font:inherit}
#ring{vertical-align:middle;margin-left:6px}
#ring circle{fill:none;stroke-width:3}
#ringF{stroke:var(--acc);transition:stroke-dashoffset 1s linear;transform:rotate(-90deg);transform-origin:50% 50%}
#stage{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:14px}
#rock{border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#rockImg{height:min(300px,52vw);display:block;user-select:none;-webkit-user-drag:none}
#rock.hit{animation:s .12s}
@keyframes s{50%{transform:translateX(4px) rotate(1.2deg)}}
.itm{padding:8px 12px;border-radius:10px;background:var(--card);border:2px solid var(--acc);font-size:14px;text-align:center}
.itm img{width:44px;height:44px;display:block}
#floor{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);animation:fall .8s ease-out;cursor:pointer}
@keyframes fall{0%{transform:translate(-50%,-170px);opacity:0}55%{transform:translate(-50%,0);opacity:1}72%{transform:translate(-50%,-22px)}100%{transform:translate(-50%,0)}}
.fly{position:fixed;z-index:60;pointer-events:none;transition:transform .65s ease-in,opacity .65s}
#bInv.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
#thieves{min-height:46px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.thief{border:1px dashed var(--acc);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
#msg{text-align:center;min-height:22px;color:var(--acc)}
#invModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#invBox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:420px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.slot{aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;font-size:12px;text-align:center;overflow:hidden}
.slot.f{border:1px solid var(--acc);background:var(--card)}
.slot .itm{border:0;background:none;padding:2px}
.slot b{position:absolute;right:4px;bottom:2px;font-size:12px}
.slotm{width:min(72px,16vw);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:6px}
.mnr{width:100%;display:flex;flex-direction:column;align-items:center}
.mnr svg{width:100%;display:block;overflow:visible}
.mnr.flip svg{transform:scaleX(-1)}
.mnr.k{cursor:pointer}
.mlab{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arm{transform-origin:40px 40px}
.swing .arm{animation:sw .28s ease-out}
@keyframes sw{0%{transform:rotate(-25deg)}40%{transform:rotate(72deg)}100%{transform:rotate(0)}}
#nickIn{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:18px}
#swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}
.sw{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--fg)}
.mrow{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div id="menu">
    <h1>⛏ Рудник</h1>
    <button class="btn main" id="bPlay">Играть</button>
    <button class="btn" id="bSneak">Пробраться</button>
    <div id="menuMsg" class="mut" style="text-align:center"></div>
  </div>

  <div id="acc" class="hide">
    <button class="small" id="bAccBack">← Меню</button>
    <h1 style="margin:24px 0">Новый шахтёр</h1>
    <input id="nickIn" maxlength="14" placeholder="Ваш ник" autocomplete="off">
    <div class="mut" style="margin-top:16px">Цвет ника</div>
    <div id="swatches"></div>
    <div class="card" style="text-align:center">Так вас увидят другие: <b id="prev">Ник</b></div>
    <div id="accErr" style="color:var(--acc);min-height:22px;text-align:center"></div>
    <button class="btn main" id="bAccOk">Создать</button>
  </div>

  <div id="sneak" class="hide">
    <div class="row"><button class="small" id="bSneakBack">← Меню</button><b>Активные рудники</b><span style="width:76px"></span></div>
    <div class="mut" style="margin:12px 0 4px;text-align:center">Выберите рудник и проберитесь внутрь. Список обновляется сам.</div>
    <div id="poolList"></div>
  </div>

  <div id="game" class="hide">
    <div class="row"><button class="small" id="bBack">← Меню</button><b id="title"></b><button class="small" id="bInv">🎒 Инвентарь</button></div>
    <div class="row" style="margin-top:14px"><span>Стамина <b id="stamTxt"></b></span>
      <svg id="ring" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" stroke="var(--bar)"/><circle id="ringF" cx="11" cy="11" r="8" stroke-dasharray="50.27" stroke-dashoffset="50.27"/></svg>
    </div>
    <div class="bar"><i id="stamBar"></i></div>
    <div id="stage"><div class="slotm" id="slotL"></div><button id="rock" aria-label="Рудник"><img id="rockImg" alt="" draggable="false"></button><div class="slotm" id="slotR"></div></div>
    <div id="msg" style="margin-top:10px"></div>
  </div>
</div>

<div id="invModal" class="hide">
  <div id="invBox">
    <div class="row"><b>Инвентарь</b><button class="small" id="bInvClose">✕</button></div>
    <div class="mut" id="pick"></div>
    <div id="grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ORES=[["Grath",50],["Grathen",30],["Korath",15],["Korashen",4],["Velgrun",.8],["Velgrath",.2]];
const KEY="mine_save_v1",NEED=50,CRACK=25,BAN=3600000,SLOTS=20;
const SPR=["assets/rock_full.png","assets/rock_cracked.png","assets/rock_broken.png"];
const $=id=>document.getElementById(id);
const COLORS=["#e5484d","#f76b15","#f5a524","#d4b200","#7bbf2a","#2fa84f","#14b8a6","#1e9bd7","#3e63dd","#7c5cd6","#c2409d","#8d8d8d"];
const PICKS={wood:{name:"Деревянная кирка",head:"#a9773c"}}; // сюда добавляются новые кирки
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:"#8d8d8d";
const pickOf=id=>PICKS[id]?id:"wood";
SPR.forEach(s=>{new Image().src=s});

// ---------- сохранение (локально в браузере) ----------
function genChances(){
  for(let t=0;t<800;t++){
    const r=ORES.map(([,b])=>b*(1+(Math.random()*2-1)*.5));
    const sum=r.reduce((a,b)=>a+b,0);
    const u=r.map(x=>x/sum*10000);
    if(!u.every((x,i)=>Math.abs(x/100-ORES[i][1])<=ORES[i][1]*.5))continue;
    const f=u.map(Math.floor);
    const rem=10000-f.reduce((a,b)=>a+b,0);
    u.map((x,i)=>[x-f[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rem).forEach(([,i])=>f[i]++);
    return f; // сотые доли процента, сумма ровно 10000
  }
  return ORES.map(o=>Math.round(o[1]*100));
}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={id:Math.random().toString(36).slice(2,10)+Date.now().toString(36),name:"Шахтёр-"+(1000+Math.floor(Math.random()*9000)),
  stamina:100,at:Date.now(),progress:0,drop:null,chances:genChances(),inv:{},bans:{},pickId:"wood",color:"#e5484d",created:false};
if(S.drop===undefined)S.drop=null;
if(!S.pickId)S.pickId="wood";if(!S.color)S.color="#e5484d";
if(!S.code){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";S.code="";for(let i=0;i<6;i++)S.code+=A[Math.floor(Math.random()*A.length)]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
function roll(){let r=Math.random()*10000,c=0;for(let i=0;i<ORES.length;i++){c+=S.chances[i];if(r<c)return ORES[i][0]}return ORES[0][0]}
function regen(){
  if(S.stamina>=100){S.stamina=100;S.at=Date.now();return}
  const m=Math.floor((Date.now()-S.at)/60000);
  if(m>0){S.stamina=Math.min(100,S.stamina+m);S.at=S.stamina>=100?Date.now():S.at+m*60000}
}
function spend(){if(S.stamina>=100)S.at=Date.now();S.stamina--}

// ---------- сеть (подключаемый слой) ----------
// "p" — PeerJS (WebRTC, прямые соединения между браузерами; работает на GitHub Pages без своего сервера).
// "c" — предпросмотр внутри Claude (там внешние серверы закрыты).
// Список сессий: игрок, занявший адрес "mineg-lobby", становится «справочным бюро»; остальные регистрируются у него.
const LB="mineg-lobby";
const Lob={peer:null,conn:null,isB:false,items:{},reg:null,cb:null,rx:0,on:false,
  start(){if(this.on)return;this.on=true;setInterval(()=>this.tick(),5000);this.become()},
  become(){
    const p=new Peer(LB);
    p.on("disconnected",()=>{try{p.reconnect()}catch(x){}});
    p.on("open",()=>{this.peer=p;this.isB=true;this.conn=null;this.items={};p.on("connection",c=>c.on("data",d=>this.serve(c,d)));this.up()});
    p.on("error",e=>{
      try{p.destroy()}catch(x){}
      if(this.peer===p){this.peer=null;this.isB=false}
      if(e.type==="unavailable-id")this.joinB();else setTimeout(()=>this.become(),3000+Math.random()*2000);
    });
  },
  joinB(){
    const p=new Peer();
    const retry=()=>{try{p.destroy()}catch(x){}if(this.peer===p){this.peer=null;this.conn=null}setTimeout(()=>this.become(),500+Math.random()*1500)};
    p.on("error",retry);
    p.on("open",()=>{
      const c=p.connect(LB,{reliable:true});
      c.on("open",()=>{this.peer=p;this.conn=c;this.isB=false;this.up()});
      c.on("data",d=>this.got(d));c.on("close",retry);
    });
  },
  up(){this.rx=Date.now();this.tick()},
  send(d){if(this.isB)this.serve(null,d);else if(this.conn&&this.conn.open)this.conn.send(d)},
  serve(c,d){
    if(!d)return;
    if(d.t==="reg")this.items[d.code]={name:String(d.name||"").slice(0,16),color:safeColor(d.color),seen:Date.now()};
    else if(d.t==="unreg")delete this.items[d.code];
    else if(d.t==="list"){
      const now=Date.now(),l=[];
      for(const k in this.items){if(now-this.items[k].seen<45000)l.push({id:k,name:this.items[k].name,color:this.items[k].color});else delete this.items[k]}
      if(c)c.send({t:"list",items:l});else this.got({t:"list",items:l});
    }
  },
  got(d){if(d&&d.t==="list"){this.rx=Date.now();if(this.cb)this.cb(d.items.map(x=>Object.assign({seen:Date.now()},x)))}},
  tick(){
    if(!this.peer)return;
    if(this.reg)this.send({t:"reg",code:this.reg.code,name:this.reg.name,color:this.reg.color});
    if(this.cb||this.reg)this.send({t:"list"});
    if(!this.isB&&(this.cb||this.reg)&&Date.now()-this.rx>15000){this.rx=Date.now();try{this.conn.close()}catch(e){}}
  }
};
const Net={on:false,kind:"",
  async init(){
    if(window.claude){try{this.db=await claude.use("db");this.rt=await claude.use("room");if(this.db&&this.rt){this.on=true;this.kind="c"}}catch(e){}}
    else if(typeof Peer!=="undefined"){this.on=true;this.kind="p"}
    return this.on;
  },
  beat(code,d){
    if(this.kind==="c")this.db.doc("sessions/"+code).set(d).catch(()=>{});
    else{Lob.reg={code,name:d.name,color:d.color};Lob.start();Lob.tick()}
  },
  drop(code){
    if(this.kind==="c")this.db.doc("sessions/"+code).delete().catch(()=>{});
    else{Lob.send({t:"unreg",code});Lob.reg=null}
  },
  lobby(cb,err){
    if(this.kind==="c")return this.db.collection("sessions").onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),err);
    Lob.cb=cb;Lob.start();Lob.tick();
    return()=>{Lob.cb=null};
  },
  async join(code,handler,host){
    if(this.kind==="c"){
      const room=await this.rt.join("mine-"+code);
      const un=room.on("g",m=>{if(!m.isMe)handler(m.data)});
      return{emit:d=>room.emit("g",d),leave(){try{un()}catch(e){}try{room.leave()}catch(e){}}};
    }
    const why=e=>{const t=e&&e.type;return t==="peer-unavailable"?"Хост с таким кодом не найден: он должен быть на экране «Играть».":t==="unavailable-id"?"Этот код уже занят (возможно, открыта другая вкладка).":["network","server-error","socket-error","socket-closed"].includes(t)?"Нет связи с сервером соединений PeerJS.":t==="timeout"?"Соединение не установилось: возможно, мешает сеть или роутер.":"Ошибка соединения"+(t?" ("+t+")":"")+"."};
    return new Promise((res,rej)=>{
      let p=null,settled=false,tries=0;
      const ok=v=>{settled=true;res(v)};
      const fail=e=>{if(settled)return;settled=true;try{p&&p.destroy()}catch(x){}rej(new Error(why(e)))};
      setTimeout(()=>fail({type:"timeout"}),15000);
      if(host){
        const conns={};
        const emit=d=>{(d.to?[conns[d.to]]:Object.values(conns)).forEach(c=>c&&c.open&&c.send(d))};
        const make=()=>{
          p=new Peer("mineg-"+code);
          p.on("error",e=>{if(e.type==="unavailable-id"&&!settled&&tries++<3){try{p.destroy()}catch(x){}setTimeout(make,2500)}else fail(e)});
          p.on("disconnected",()=>{try{p.reconnect()}catch(x){}});
          p.on("open",()=>ok({emit,leave(){p.destroy()}}));
          p.on("connection",c=>c.on("data",d=>{if(d&&d.id)conns[d.id]=c;handler(d)}));
        };
        make();
      }else{
        p=new Peer();
        p.on("error",fail);
        p.on("open",()=>{
          const c=p.connect("mineg-"+code,{reliable:true});
          c.on("open",()=>ok({emit:d=>c.open&&c.send(d),leave(){p.destroy()}}));
          c.on("data",handler);c.on("close",()=>handler({t:"gone"}));c.on("error",fail);
        });
      }
    });
  }
};
const ready=Net.init();

let room=null,mode="menu",target=null,thieves={},hb=null,sweep=null,unsubPool=null,pool=[],gotProg=false,vProg=0,vDrop=false;
const emit=d=>{try{room&&room.emit(d)}catch(e){}};
function show(id){["menu","acc","sneak","game"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function say(t){$("msg").textContent=t||""}

// ---------- предметы, полёт в инвентарь ----------
function itemEl(name,withImg){
  const d=document.createElement("div");d.className="itm";d.textContent=name;
  if(withImg){const i=new Image();i.alt=name;i.onload=()=>{d.textContent="";d.append(i)};i.src="assets/ores/"+name+".png"} // картинки руд: assets/ores/<Имя>.png
  return d;
}
function fly(name,r){
  const t=$("bInv").getBoundingClientRect(),e=itemEl(name,false);
  e.classList.add("fly");e.style.left=r.left+"px";e.style.top=r.top+"px";document.body.append(e);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    e.style.transform="translate("+(t.left+t.width/2-r.left-r.width/2)+"px,"+(t.top-r.top)+"px) scale(.3)";e.style.opacity=".2";
  }));
  setTimeout(()=>{e.remove();const b=$("bInv");b.classList.add("pop");setTimeout(()=>b.classList.remove("pop"),300)},680);
}

// ---------- шахтёры ----------
function minerEl(m){
  const d=document.createElement("div");d.className="mnr"+(m.flip?" flip":"")+(m.click?" k":"");
  const head=PICKS[pickOf(m.pick)].head;
  d.innerHTML='<svg viewBox="0 0 76 96"><rect x="21" y="62" width="8" height="28" rx="3" fill="#3b3a46"/><rect x="34" y="62" width="8" height="28" rx="3" fill="#3b3a46"/><rect x="17" y="32" width="28" height="34" rx="8" fill="'+safeColor(m.color)+'"/><circle cx="31" cy="22" r="11" fill="#f1c9a0"/><path d="M19 21a12 12 0 0 1 24 0z" fill="#f5c542"/><rect x="18" y="19" width="26" height="4" rx="2" fill="#e0a800"/><g class="arm"><rect x="38" y="36" width="18" height="7" rx="3" fill="#f1c9a0"/><rect x="53" y="6" width="4" height="46" rx="2" fill="#7a5230"/><path d="M40 12Q55 -2 70 12L67 16Q55 6 43 16Z" fill="'+head+'"/></g></svg>';
  const l=document.createElement("div");l.className="mlab";l.textContent=m.name;l.style.color=safeColor(m.color);
  d.append(l);if(m.click)d.onclick=m.click;
  return d;
}
const mEls={};
function syncMiner(slot,key,info){
  const cur=mEls[key];
  if(!info){if(cur){cur.el.remove();delete mEls[key]}return}
  const sig=[info.name,info.color,info.pick].join("|");
  if(cur&&cur.sig===sig)return;
  const el=minerEl(info);
  if(cur)cur.el.replaceWith(el);else slot.append(el);
  mEls[key]={el,sig};
}
function clearMiners(){for(const k in mEls){mEls[k].el.remove();delete mEls[k]}}
function swing(key){const c=mEls[key];if(!c)return;c.el.classList.remove("swing");void c.el.offsetWidth;c.el.classList.add("swing")}
function hitRock(){const r=$("rock");r.classList.remove("hit");void r.offsetWidth;r.classList.add("hit")}
function setTitle(pre,name,color){const t=$("title");t.textContent=pre;if(name){const s=document.createElement("span");s.textContent=name;s.style.color=safeColor(color);t.append(" ",s)}}

// ---------- аккаунт ----------
let accCb=null,accColor=COLORS[0];
COLORS.forEach(c=>{const b=document.createElement("button");b.className="sw";b.style.background=c;b.dataset.c=c;b.onclick=()=>{accColor=c;accUp()};$("swatches").append(b)});
function accUp(){
  document.querySelectorAll(".sw").forEach(b=>b.classList.toggle("on",b.dataset.c===accColor));
  const p=$("prev");p.textContent=$("nickIn").value.trim()||"Ник";p.style.color=accColor;
}
$("nickIn").oninput=accUp;
function needAcc(cb){
  if(S.created)return false;
  accCb=cb;$("nickIn").value="";accColor=COLORS[0];$("accErr").textContent="";accUp();show("acc");return true;
}
$("bAccOk").onclick=()=>{
  const n=$("nickIn").value.trim();
  if(n.length<2){$("accErr").textContent="Ник должен быть от 2 до 14 символов.";return}
  S.name=n;S.color=accColor;S.created=true;save();
  const cb=accCb;accCb=null;if(cb)cb();
};
$("bAccBack").onclick=()=>show("menu");

// ---------- меню и список рудников ----------
$("bPlay").onclick=()=>{if(!needAcc(startHost))startHost()};
$("bSneak").onclick=()=>{if(!needAcc(openSneak))openSneak()};
$("bSneakBack").onclick=closeSneak;
async function openSneak(){
  await ready;$("menuMsg").textContent="";show("sneak");pool=[];$("poolList").textContent="";
  if(!Net.on){$("poolList").textContent="Онлайн не настроен.";return}
  if(unsubPool)unsubPool();
  const bad=()=>{$("poolList").textContent="Не удалось загрузить список."};
  renderPool();
  try{unsubPool=Net.lobby(l=>{pool=l;renderPool()},bad)}catch(e){bad()}
}
function closeSneak(){if(unsubPool){unsubPool();unsubPool=null}show("menu")}
function renderPool(){
  const box=$("poolList");box.textContent="";
  const live=pool.filter(p=>p.id!==S.code&&Date.now()-(p.seen||0)<45000);
  if(!live.length){const d=document.createElement("div");d.className="card mut";d.style.textAlign="center";d.textContent="Сейчас никто не копает. Загляните позже.";box.append(d);return}
  live.forEach(p=>{
    const ban=(S.bans[p.id]||0)-Date.now(),col=safeColor(p.color),nm=String(p.name||"Игрок").slice(0,16);
    const c=document.createElement("div");c.className="card mrow";
    const av=document.createElement("div");av.className="av";av.style.background=col;av.textContent=nm[0].toUpperCase();
    const mid=document.createElement("div");mid.style.cssText="flex:1;min-width:0";
    const n=document.createElement("div");n.className="nm";n.style.color=col;n.textContent=nm;
    const st=document.createElement("div");st.className="mut";st.textContent=ban>0?"Вход закрыт ещё "+Math.ceil(ban/60000)+" мин":"Добывает руду";
    mid.append(n,st);
    const b=document.createElement("button");b.className="small";b.textContent="Пробраться";b.disabled=ban>0;b.onclick=()=>startSteal(p);
    c.append(av,mid,b);box.append(c);
  });
}
setInterval(()=>{if(!$("sneak").classList.contains("hide"))renderPool()},10000);

// ---------- хост ----------
async function startHost(){
  await ready;mode="host";target=null;thieves={};clearMiners();show("game");setTitle("Ваш рудник");say("");
  if(Net.on){try{room=await Net.join(S.code,onHost,true)}catch(e){room=null;say("Без сети: "+((e&&e.message)||"онлайн недоступен"))}}
  if(mode!=="host"){try{room&&room.leave()}catch(e){}room=null;return}
  beat();hb=setInterval(beat,15000);
  sweep=setInterval(()=>{let ch=false;for(const k in thieves)if(Date.now()-thieves[k].seen>25000){delete thieves[k];ch=true}if(ch)render()},3000);
  render();
}
function beat(){if(Net.on)Net.beat(S.code,{name:S.name,color:S.color,seen:Date.now()})}
const progMsg=hit=>({t:"prog",n:S.progress,drop:!!S.drop,hit:hit?1:0,nm:S.name,cl:S.color,pk:S.pickId});
const prog=hit=>emit(progMsg(hit));
function onHost(d){
  if(!d||!d.id)return;
  const banned=(S.bans[d.id]||0)>Date.now();
  if(d.t==="enter"){
    if(banned){emit({t:"deny",to:d.id});return}
    const isNew=!thieves[d.id];
    thieves[d.id]={name:String(d.name||"Вор").slice(0,16),color:safeColor(d.cl),pick:pickOf(d.pk),seen:Date.now()};
    emit(Object.assign(progMsg(0),{to:d.id}));
    if(isNew){say("Кто-то пробрался! Нажмите на шахтёра, чтобы прогнать.");render()}
  }else if(!thieves[d.id]||banned){return}
  else if(d.t==="click"){
    thieves[d.id].seen=Date.now();
    if(S.progress<NEED){S.progress++;if(S.progress>=NEED)S.drop=roll();hitRock();swing("t"+d.id)}
    save();prog(0);render();
  }else if(d.t==="pick"){
    if(!S.drop)return;
    const o=S.drop;S.drop=null;S.progress=0;save();
    emit({t:"ore",to:d.id,ore:o});prog(0);render();
  }else if(d.t==="leave"){delete thieves[d.id];render()}
}
function kick(id){
  S.bans[id]=Date.now()+BAN;save();emit({t:"kick",to:id});
  delete thieves[id];say("Вора прогнали! Ему закрыт вход на час.");render();
}

// ---------- вор ----------
let owner=null;
async function startSteal(p){
  if((S.bans[p.id]||0)>Date.now())return;
  await ready;if(!Net.on)return;
  mode="steal";target=p;gotProg=false;vProg=0;vDrop=false;owner=null;clearMiners();show("game");
  if(unsubPool){unsubPool();unsubPool=null}
  setTitle("Рудник:",p.name||"Игрок",p.color);say("Подкрадываемся…");
  try{room=await Net.join(p.id,onThief,false)}catch(e){leave((e&&e.message)||"Не удалось подключиться.");return}
  if(mode!=="steal"){try{room&&room.leave()}catch(e){}room=null;return}
  const enter=()=>emit({t:"enter",id:S.id,name:S.name,cl:S.color,pk:S.pickId});
  enter();hb=setInterval(enter,8000);
  setTimeout(()=>{if(mode==="steal"&&!gotProg)say("Хост не отвечает — возможно, он ушёл.")},7000);
  render();
}
function onThief(d){
  if(mode!=="steal"||!d||(d.to&&d.to!==S.id))return;
  if(d.t==="gone"){leave("Хост ушёл.");return}
  if(d.t==="prog"){
    gotProg=true;vProg=d.n;vDrop=!!d.drop;
    if(d.nm)owner={name:String(d.nm).slice(0,16),color:safeColor(d.cl),pick:pickOf(d.pk)};
    if(/^(Подкрад|Хост)/.test($("msg").textContent))say("");
    render();
    if(d.hit){hitRock();swing("own")}
  }
  else if(d.t==="ore"){
    S.inv[d.ore]=(S.inv[d.ore]||0)+1;save();say("Украдено: "+d.ore+"!");
    const f=$("floor");fly(d.ore,(f||$("stage")).getBoundingClientRect());render();
  }
  else if(d.t==="kick"){S.bans[target.id]=Date.now()+BAN;save();leave("Вас заметили и прогнали! Вход в этот рудник закрыт на час.")}
  else if(d.t==="deny")leave("Вам закрыт вход в этот рудник.");
}

// ---------- общее ----------
$("bBack").onclick=()=>leave();
function leave(text){
  if(mode==="steal")emit({t:"leave",id:S.id});
  if(mode==="host"&&Net.on)Net.drop(S.code);
  clearInterval(hb);clearInterval(sweep);
  if(room){try{room.leave()}catch(e){}room=null}
  mode="menu";target=null;thieves={};clearMiners();show("menu");closeInv();
  $("menuMsg").textContent=text||"";
}
addEventListener("pagehide",()=>{if(mode==="host"&&Net.on)Net.drop(S.code);if(mode==="steal")emit({t:"leave",id:S.id})});

$("rock").onclick=()=>{
  regen();
  const p=mode==="steal"?vProg:S.progress;
  if(p>=NEED)return;
  if(S.stamina<=0){say("Нет стамины.");render();return}
  hitRock();
  if(mode==="host"){
    spend();S.progress++;if(S.progress>=NEED)S.drop=roll();swing("own");say("");save();prog(1);
  }else if(mode==="steal"){
    spend();save();vProg=Math.min(NEED-1,vProg+1);swing("me");emit({t:"click",id:S.id});say("");
  }
  render();
};
function pickDrop(){
  const el=$("floor");if(!el)return;
  if(mode==="host"&&S.drop){
    const o=S.drop,r=el.getBoundingClientRect();
    S.drop=null;S.progress=0;S.inv[o]=(S.inv[o]||0)+1;save();fly(o,r);prog(0);render();
  }else if(mode==="steal"&&vDrop)emit({t:"pick",id:S.id});
}

// ---------- инвентарь ----------
$("bInv").onclick=()=>{$("invModal").classList.remove("hide");invKey="";render()};
function closeInv(){$("invModal").classList.add("hide")}
$("bInvClose").onclick=closeInv;
$("invModal").onclick=e=>{if(e.target.id==="invModal")closeInv()};
let invKey="";
function renderInv(){
  const k=JSON.stringify(S.inv);if(k===invKey)return;invKey=k;
  $("pick").textContent=PICKS[pickOf(S.pickId)].name;
  const g=$("grid");g.textContent="";
  const have=ORES.filter(([n])=>S.inv[n]);
  for(let i=0;i<SLOTS;i++){
    const sl=document.createElement("div");sl.className="slot";
    if(have[i]){sl.classList.add("f");sl.append(itemEl(have[i][0],true));const b=document.createElement("b");b.textContent=S.inv[have[i][0]];sl.append(b)}
    g.append(sl);
  }
}

// ---------- отрисовка ----------
function render(){
  regen();
  const p=mode==="steal"?vProg:S.progress,has=mode==="steal"?vDrop:!!S.drop;
  const src=p>=NEED?SPR[2]:p>=CRACK?SPR[1]:SPR[0];
  if($("rockImg").getAttribute("src")!==src)$("rockImg").src=src;
  $("stamTxt").textContent=S.stamina+" / 100";
  $("stamBar").style.width=S.stamina+"%";
  const fr=S.stamina>=100?1:Math.min(1,(Date.now()-S.at)/60000);
  $("ringF").style.strokeDashoffset=50.27*(1-fr);
  $("ring").style.opacity=S.stamina>=100?.35:1;
  let f=$("floor");
  if(has&&!f){f=itemEl(mode==="steal"?"Руда":S.drop,mode==="host");f.id="floor";f.onclick=pickDrop;$("stage").append(f)}
  else if(!has&&f)f.remove();
  const L=$("slotL"),R=$("slotR");
  if(mode==="host"){
    syncMiner(L,"own",{name:S.name,color:S.color,pick:S.pickId});
    for(const id in thieves){const t=thieves[id];syncMiner(R,"t"+id,{name:t.name,color:t.color,pick:t.pick,flip:true,click:()=>kick(id)})}
    for(const k of Object.keys(mEls))if(k[0]==="t"&&!thieves[k.slice(1)])syncMiner(R,k,null);
  }else if(mode==="steal"){
    syncMiner(L,"own",owner);
    syncMiner(R,"me",{name:S.name,color:S.color,pick:S.pickId,flip:true});
  }
  if(!$("invModal").classList.contains("hide"))renderInv();
}
setInterval(()=>{if(mode==="host"||mode==="steal")render()},1000);
</script>
</body>
